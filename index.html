<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futuristic UI Demo</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f1224;
      --card-bg: rgba(255, 255, 255, 0.08);
      --accent: linear-gradient(135deg, #7f7cff, #5df2c4);
      --text-main: #ffffff;
      --text-sub: #b8b9d6;
      --blur: blur(18px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, #2b2f77, transparent 40%),
        radial-gradient(circle at 80% 10%, #1c6f5a, transparent 45%),
        radial-gradient(circle at 50% 80%, #3a1c5d, transparent 40%),
        var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      width: 420px;
      padding: 36px;
      background: var(--card-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-sub);
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      gap: 14px;
    }

      flex: 1;
      padding: 12px 0
